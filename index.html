<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Garje - Portfolio</title>
    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&amp;display=swap" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="blue darken-2" role="navigation">
        <div class="nav-wrapper container">
            <a id="logo-container" href="#" class="brand-logo">Gaurav Garje</a>
            <ul class="right hide-on-med-and-down">
                <li><a href="#skills">Skills</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <a href="#" data-target="nav-mobile" class="sidenav-trigger"><i class="material-icons">menu</i></a>
        </div>
    </nav>

    <ul id="nav-mobile" class="sidenav">
        <li><a href="#skills">Skills</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>

    <!-- Hero -->
    <header class="center-align">
        <img class="profile-img" src="images/profile.png" alt="Gaurav Garje">
        <h1>Gaurav Garje</h1>
        <p class="flow-text">Engineering student pursuing a career in IT programming.</p>
    </header>

    <!-- Skills -->
    <section id="skills" class="container">
        <h4 class="center-align">Skills</h4>
        <div class="row">
            <div class="col s12 m6">
                <span class="skill-name">Java</span>
                <div class="progress">
                    <div class="determinate" style="width:75%"></div>
                </div>
            </div>
            <div class="col s12 m6">
                <span class="skill-name">C++</span>
                <div class="progress">
                    <div class="determinate" style="width:75%"></div>
                </div>
            </div>
            <div class="col s12 m6">
                <span class="skill-name">HTML</span>
                <div class="progress">
                    <div class="determinate" style="width:75%"></div>
                </div>
            </div>
            <div class="col s12 m6">
                <span class="skill-name">Python</span>
                <div class="progress">
                    <div class="determinate" style="width:75%"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="blue lighten-5">
        <div class="container center-align">
            <h4>Get in touch</h4>
            <p>Find me on <a href="https://in.linkedin.com/in/gaurav-garje-644a24183">LinkedIn</a>.</p>
        </div>
    </section>

    <footer class="center-align">
        <p>&copy; 2021 Gaurav Garje</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var elems = document.querySelectorAll('.sidenav');
            var instances = M.Sidenav.init(elems);
        });
    </script>
</body>
</html>
